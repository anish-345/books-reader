name: book_reader
description: "A comprehensive PDF and EPUB reader app with file manager integration."
publish_to: 'none' 

version: 2.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Core functionality
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4
  
  # PDF/EPUB readers
  flutter_pdfview: ^1.3.2 # Android and iOS
  syncfusion_flutter_pdfviewer: ^26.1.41 # Windows, macOS, Linux, Web
  epubx: ^4.0.0
  
  # HTML rendering
  flutter_html: ^3.0.0-beta.2
  
  # Essential utilities
  archive: ^3.6.1
  
  # Ads (Android and iOS)
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
